# compose.yml — Open WebUI via Apple Container (container-compose), talking to
# your NATIVE, Metal-accelerated Ollama.
#
# WHY THIS SHAPE
#  - Ollama is installed natively (brew) and runs with Metal GPU. We keep it
#    native and let the WebUI container reach it across the Apple Container
#    bridge, instead of shipping a second, GPU-less Ollama inside a Linux VM.
#  - Apple Container does NOT provide `host.containers.internal` and does NOT
#    support `--add-host` / `extra_hosts`. From inside a container the host is
#    reachable at the VM's default gateway IP — which is NOT static (it can
#    change if the Apple Container VM is recreated). So we do NOT hardcode it:
#    ./start.sh detects the live gateway and substitutes it into this file
#    before launching. Re-check anytime with:   container run alpine:latest ip route
#    (read the "default via <IP>" line).
#  - Native Ollama listens on 0.0.0.0 (not just loopback) so the bridge can
#    reach it. This is now baked into the LaunchAgent plist
#    (~/Library/LaunchAgents/sh.brew.ollama.plist -> EnvironmentVariables ->
#    OLLAMA_HOST=0.0.0.0:11434) and survives reboots. See the note at the
#    bottom of this file about the one `brew services` gotcha.
#
# container-compose QUIRKS handled here:
#  - Named volumes with a subpath (vol:/app/backend/data) get mounted at the
#    PARENT dir (/app/backend/), shadowing the app code. So we use an explicit
#    bind mount for the subpath instead.
#  - `environment` must be a mapping, not a `- KEY=value` list.
#  - No ${VAR} interpolation, so the gateway IP is injected by ./start.sh.
#
# LAUNCH  (use start.sh — it auto-detects the gateway IP; do not hardcode)
#   cd ~/Workspaces/open-web-ui
#   ./start.sh
#   open http://localhost:3000   (first run creates an admin account)

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"            # host : container (image listens on 8080)
    environment:
      # Gateway IP is injected at launch by ./start.sh. The placeholder token
      # in the value line below is replaced with the live Apple Container host
      # gateway (no host.docker.internal / ${VAR} interpolation available).
      OLLAMA_BASE_URL: http://__OLLAMA_HOST_IP__:11434
    volumes:
      # Bind mount (NOT a named volume): container-compose mishandles named
      # volume subpaths, mounting at /app/backend/ and hiding the app code.
      - ~/.containers/Volumes/open-web-ui/open-webui-data:/app/backend/data

# --- 0.0.0.0 BIND FOR NATIVE OLLAMA: ALREADY APPLIED (persists reboots) ------
# OLLAMA_HOST=0.0.0.0:11434 is baked into
# ~/Library/LaunchAgents/sh.brew.ollama.plist (EnvironmentVariables) and loaded
# directly via `launchctl load` (NOT `brew services`). launchd loads that plist
# at login, so the bind survives reboots.
#
# GOTCHA: `brew services restart ollama` regenerates the plist from the formula
# and WIPES the OLLAMA_HOST key. If you ever restart via brew, re-apply it:
#   launchctl unload ~/Library/LaunchAgents/sh.brew.ollama.plist
#   # re-add <key>OLLAMA_HOST</key><string>0.0.0.0:11434</string> in the plist
#   launchctl load   ~/Library/LaunchAgents/sh.brew.ollama.plist
# Safer restart path that keeps the bind:
#   launchctl unload ~/Library/LaunchAgents/sh.brew.ollama.plist
#   launchctl load   ~/Library/LaunchAgents/sh.brew.ollama.plist
# ---------------------------------------------------------------------------
